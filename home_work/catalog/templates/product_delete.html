{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Удаление продукта</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="alert alert-warning">
                            <h4 class="alert-heading">Внимание!</h4>
                            <p>Вы уверены, что хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>
                            <hr>
                            <p class="mb-0">Это действие нельзя отменить. Все данные о продукте будут удалены безвозвратно.</p>
                        </div>

                        {% if object.image %}
                        <div class="text-center mb-4">
                            <img src="{{ object.image.url }}" class="img-fluid rounded" style="max-height: 200px;">
                        </div>
                        {% endif %}

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'catalog:product_details' object.pk %}" class="btn btn-secondary me-md-2">Отмена</a>
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
