<div class="row">
    <div class="col-12 col-md text-center">
        SkyStore
        <small class="d-block mb-3 text-muted">&copy; 2023</small>
    </div>
    <div class="col-6 col-md">
        <h5>Категории</h5>
        <ul class="list-unstyled text-small">
            {% for category in all_categories %}
            <li><a class="text-muted" href="{% url 'catalog:category_products' category.id %}">{{ category.name }}</a></li>
            {% endfor %}
        </ul>
    </div>
    <div class="col-6 col-md">
        <h5>Дополнительно</h5>
        <ul class="list-unstyled text-small">
            <li><a class="text-muted" href="{% url 'blog:greeting' %}">Наш бессмысленный блог</a></li>
        </ul>
    </div>
    <div class="col-6 col-md">
        <h5>О нас</h5>
        <ul class="list-unstyled text-small">
            <li><a class="text-muted" href="/contacts/">Контакты</a></li>
        </ul>
    </div>
</div>
