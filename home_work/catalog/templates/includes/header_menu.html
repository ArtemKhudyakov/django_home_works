<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-dark text-decoration-none">Skystore</a>
    </h5>

    <!-- Основные кнопки навигации -->
    <nav class="ms-5">
        <a class="btn btn-sm btn-outline-primary me-2" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="btn btn-sm btn-outline-primary me-2" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="btn btn-sm btn-outline-secondary me-2" href="{% url 'blog:greeting' %}">Блог</a>
        {% if user.is_staff %}
            <a href="{% url 'catalog:product_create' %}" class="btn btn-sm btn-success me-2">Создать продукт</a>
        {% endif %}
    </nav>

    <div class="ms-auto d-flex align-items-center">
        {% if user.is_authenticated %}
            <div class="d-flex align-items-center">
                <span class="me-2 small d-none d-md-inline">Привет, {{ user.username }}!</span>
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}"
                         alt="Аватар"
                         class="rounded-circle border me-2"
                         width="50"
                         height="50"
                         style="object-fit: cover;">
                {% else %}
                    <div class="bg-light rounded-circle border d-flex align-items-center justify-content-center me-2"
                         style="width: 50px; height: 50px;">
                        <i class="bi bi-person fs-5 text-muted"></i>
                    </div>
                {% endif %}

                <div class="d-flex flex-column">
                    <!-- Кнопка профиля -->
                    <a href="{% url 'users:profile_edit' %}" class="btn btn-sm btn-outline-primary mb-1">
                        Профиль
                    </a>
                    <!-- Кнопка выхода -->
                    <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-danger w-100">Выйти</button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="btn-group">
                <a class="btn btn-sm btn-outline-primary" href="{% url 'users:login' %}">Войти</a>
                <a class="btn btn-sm btn-primary" href="{% url 'users:register' %}">Регистрация</a>
            </div>
        {% endif %}
    </div>
</div>
